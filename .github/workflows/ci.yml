name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore backend/src/IngSoftStudio.Api/IngSoftStudio.Api.csproj

      - name: Build API
        run: dotnet build backend/src/IngSoftStudio.Api/IngSoftStudio.Api.csproj --configuration Release --no-restore

      - name: Validate EF Core model snapshot
        shell: pwsh
        env:
          Jwt__SigningKey: IngSoftStudio_CI_Model_Snapshot_Key_2026_Secure!
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.8
          dotnet ef migrations has-pending-model-changes `
            --project backend/src/IngSoftStudio.Infrastructure/IngSoftStudio.Infrastructure.csproj `
            --startup-project backend/src/IngSoftStudio.Api/IngSoftStudio.Api.csproj `
            --configuration Release `
            --no-build

      - name: Restore domain tests
        run: dotnet restore backend/tests/IngSoftStudio.Domain.Tests/IngSoftStudio.Domain.Tests.csproj

      - name: Run domain tests
        run: dotnet test backend/tests/IngSoftStudio.Domain.Tests/IngSoftStudio.Domain.Tests.csproj --configuration Release --no-restore

      - name: Restore integration tests
        run: dotnet restore backend/tests/IngSoftStudio.Api.IntegrationTests/IngSoftStudio.Api.IntegrationTests.csproj

      - name: Run integration tests
        run: dotnet test backend/tests/IngSoftStudio.Api.IntegrationTests/IngSoftStudio.Api.IntegrationTests.csproj --configuration Release --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
